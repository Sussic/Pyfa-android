          --output "${{ runner.temp }}/pyfa-targeting-check"
      - name: Show concise evidence or failure excerpt
        if: always()
        shell: pwsh
        run: |
          $referenceDir = Join-Path $env:RUNNER_TEMP 'pyfa-desktop-reference'
          $evidence = Join-Path $referenceDir 'evidence.json'
          if (Test-Path $evidence) { Get-Content $evidence }
          if ('${{ job.status }}' -ne 'success' -and (Test-Path $referenceDir)) {
            Get-ChildItem $referenceDir -Filter '*.log' | ForEach-Object {
              Write-Output $_.Name
              Get-Content $_.FullName -Tail 35
            }
          }
          $headlessDir = Join-Path $env:RUNNER_TEMP 'pyfa-headless-check'
          $headlessEvidence = Join-Path $headlessDir 'evidence.json'
          if (Test-Path $headlessEvidence) { Get-Content $headlessEvidence }
          if ('${{ job.status }}' -ne 'success' -and (Test-Path $headlessDir)) {
            Get-ChildItem $headlessDir -Filter '*.log' | ForEach-Object {
              Write-Output $_.Name
              Get-Content $_.FullName -Tail 40
            }
