name: Desktop reference

on:
  pull_request:
    paths:
      - 'android_bridge/**'
      - 'eos/**'
      - 'utils/**'
      - 'tools/android_headless/**'
      - 'tools/android_reference/**'
      - '.github/workflows/desktop-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: windows-latest
    # B04.2.3.2 adds measured 4.6 min reference + 2.8 min host coverage.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            android_bridge
            eos
            utils
            tools/android_reference
            tools/android_headless
      - name: Check out the independent pinned reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Sussic/Pyfa-android
          ref: 8b04f3b271e614b3e103853b44a7851a63d79d0e
          path: reference-upstream
          sparse-checkout: |
            eos
            utils
            staticdata
            service
            gui
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned host dependencies
        run: >-
          python -m pip install --only-binary=:all: -r tools/android_reference/requirements.txt
      - name: Test comparison and data provenance checks
        run: python -m unittest discover -s tools/android_reference/tests -v
      - name: Rebuild and compare the real desktop reference
        run: >-
          python -I tools/android_reference/reference.py
          --source reference-upstream
          --output "${{ runner.temp }}/pyfa-desktop-reference"
          --check tools/android_reference/fixtures/vexor.json
      - name: Verify desktop migration backup compatibility
        run: >-
          python -I tools/android_headless/check_desktop_migration.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
      - name: Compare the independent desktop projection reference
        run: >-
          python -I tools/android_reference/projection.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-projection-reference"
          --check tools/android_reference/fixtures/projection.json
      - name: Compare the independent desktop command reference
        run: >-
          python -I tools/android_reference/command.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-command-reference"
          --check tools/android_reference/fixtures/command.json
      - name: Verify the independent desktop hull catalogue
        run: >-
          python -I tools/android_reference/catalog.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-catalog-reference"
          --check tools/android_reference/fixtures/catalog.json
      - name: Verify the independent desktop equipment catalogue and searches
        run: >-
          python -I tools/android_reference/equipment.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-equipment-reference"
          --check tools/android_reference/fixtures/equipment.json
      - name: Verify all independent empty ship and structure values
        run: >-
          python -I tools/android_reference/empty_hulls.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-empty-hulls-reference"
          --check tools/android_reference/fixtures/empty-hulls.json
      - name: Verify independent desktop module commands, legality and recent use
        run: >-
          python -I tools/android_reference/module_edits.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-module-edits-reference"
          --check tools/android_reference/fixtures/module-edits.json
      - name: Verify independent charge commands and complete compatible sets
        run: >-
          python -I tools/android_reference/charge_edits.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-charge-edits-reference"
          --check tools/android_reference/fixtures/charge-edits.json
      - name: Create a separate environment without desktop dependencies
        run: python -m venv "${{ runner.temp }}/pyfa-headless-venv"
      - name: Install pinned headless dependencies
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -m pip install --only-binary=:all: -r tools/android_headless/requirements.txt
      - name: Compare the headless adapter and run behavioral tests
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-headless-check"
      - name: Compare headless projections and run behavioral tests
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check.py --scenario projection
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-projection-check"
      - name: Compare headless command bursts and run behavioral tests
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check.py --scenario command
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-command-check"
      - name: Verify typed bridge and atomic failure recovery
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_bridge.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-bridge-check"
      - name: Verify durable fit graphs across process restart and interrupted saves
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_persistence.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-persistence-check"
      - name: Verify fit library lifecycle and restart
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_library.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-library-check"
      - name: Verify complete offline equipment discovery
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_market.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-equipment-check"
      - name: Verify complete empty hull parity, rejection and persistence
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_empty_hulls.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-empty-hulls-check"
      - name: Verify module mutation parity, atomic history and process restart
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_module_edits.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-module-edits-check"
      - name: Verify charge parity, atomic saves and process restart
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_charge_edits.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-charge-edits-check"
      - name: Verify independent variation commands and all supported families
        run: >-
          python -I tools/android_reference/variation_edits.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-variation-edits-reference"
          --check tools/android_reference/fixtures/variation-edits.json
      - name: Verify variation parity, atomic saves and process restart
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_variation_edits.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-variation-edits-check"
      - name: Verify original rack swaps and positional heat
        run: >-
          python -I tools/android_reference/rack_ordering.py
          --source reference-upstream
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-rack-ordering-reference"
          --check tools/android_reference/fixtures/rack-ordering.json
      - name: Verify ordering parity, atomic saves and restart
        shell: pwsh
        run: >-
          & "${{ runner.temp }}/pyfa-headless-venv/Scripts/python.exe"
          -I tools/android_headless/check_rack_ordering.py
          --database "${{ runner.temp }}/pyfa-desktop-reference/eve.db"
          --output "${{ runner.temp }}/pyfa-rack-ordering-check"
      - name: Show concise evidence or failure excerpt
        if: always()
        shell: pwsh
        run: |
          $referenceDir = Join-Path $env:RUNNER_TEMP 'pyfa-desktop-reference'
          $evidence = Join-Path $referenceDir 'evidence.json'
          if (Test-Path $evidence) { Get-Content $evidence }
          if ('${{ job.status }}' -ne 'success' -and (Test-Path $referenceDir)) {
            Get-ChildItem $referenceDir -Filter '*.log' | ForEach-Object {
              Write-Output $_.Name
              Get-Content $_.FullName -Tail 35
            }
          }
          $headlessDir = Join-Path $env:RUNNER_TEMP 'pyfa-headless-check'
          $headlessEvidence = Join-Path $headlessDir 'evidence.json'
          if (Test-Path $headlessEvidence) { Get-Content $headlessEvidence }
          if ('${{ job.status }}' -ne 'success' -and (Test-Path $headlessDir)) {
            Get-ChildItem $headlessDir -Filter '*.log' | ForEach-Object {
              Write-Output $_.Name
              Get-Content $_.FullName -Tail 40
            }
          }
          foreach ($name in @('pyfa-projection-reference', 'pyfa-projection-check', 'pyfa-command-reference', 'pyfa-command-check', 'pyfa-bridge-check', 'pyfa-persistence-check', 'pyfa-library-check', 'pyfa-equipment-reference', 'pyfa-equipment-check', 'pyfa-empty-hulls-reference', 'pyfa-empty-hulls-check', 'pyfa-module-edits-reference', 'pyfa-module-edits-check', 'pyfa-charge-edits-reference', 'pyfa-charge-edits-check', 'pyfa-variation-edits-reference', 'pyfa-variation-edits-check', 'pyfa-rack-ordering-reference', 'pyfa-rack-ordering-check')) {
            $projectionDir = Join-Path $env:RUNNER_TEMP $name
            $projectionEvidence = Join-Path $projectionDir 'evidence.json'
            if (Test-Path $projectionEvidence) {
              Write-Output $name
              Get-Content $projectionEvidence
            }
            if ('${{ job.status }}' -ne 'success' -and (Test-Path $projectionDir)) {
              Get-ChildItem $projectionDir -Filter '*.log' | ForEach-Object {
                Write-Output $_.Name
                Get-Content $_.FullName -Tail 40
              }
            }
          }
# No uploads, caches, scheduled builds or release publication for this host check.
