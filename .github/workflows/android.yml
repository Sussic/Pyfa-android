name: Android native

on:
  pull_request:
    paths:
      - 'android/**'
      - '!android/**/*.md'
      - '.github/workflows/android.yml'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      upload_apk:
        description: 'Deliver the tested development APK (expires after one day)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build, lint and native assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: android
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Verify wrapper and install pinned SDK packages
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          mkdir -p build/evidence
          java -version 2> build/evidence/java-version.txt
          sdkmanager --list_installed > build/evidence/sdk-packages.txt
          ./gradlew --version > build/evidence/gradle-version.txt
      - name: Build APKs and run lint
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify development APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > build/evidence/apk-signature.txt'
      - name: Enable and verify KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-pyfa-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Test a fresh offline installation on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          emulator-build: '15917651' # 37.1.11, stable package checked 2026-09-13
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash ci/native-test.sh
      - name: Retain concise native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-evidence-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            android/build/evidence/
            android/app/build/outputs/androidTest-results/connected/**/*.xml
            android/app/build/reports/lint-results-debug.html
      - name: Deliver the tested development APK
        if: github.event_name == 'workflow_dispatch' && inputs.upload_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyfa-android-dev-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: android/app/build/outputs/apk/debug/app-debug.apk
